on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Approve deployment? Select 'True' to proceed."
        required: true
        default: "Select an option"
        type: choice
        options:
          - "Select an Option"
          - "True"
          - "False"

jobs:
  deploy-green:
    runs-on: ubuntu-latest
    if: github.event.inputs.approve == 'True' 
    steps:
      - name: Validate Selection
        if: github.event.inputs.approve != 'True'
        run: |
          echo "Approver did not accepted."
          exit 1  # Fail the workflow if the user doesn't choose "True" or "False"

      - name: Display Approver Name
        run: |
          echo "Deployment approved by: ${{ github.actor }}"    
          
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Green
        run: echo "Deploying new version to Green environment"

      - name: Test Green Deployment
        run: echo "Running tests on Green environment"
        
      - name: Manual Approval for Traffic Switch
        uses: trstringer/manual-approval@v1 # Use the manual approval action
        with:
          approvers: 'dhanrajdesai3200@gmail.com' # Replace with you approver's GitHub usernames
          minimum-approvals: 1
        env:
          INPUT_SECRET: ${{ secrets.TOKEN_ID }}
          
