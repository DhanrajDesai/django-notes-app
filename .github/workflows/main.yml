name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Run a simple command
        run:  |
          ls -l > output.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: demo_logs.txt
          path: demo_logs.txt
             
