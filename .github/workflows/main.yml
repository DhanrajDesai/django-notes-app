name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Run a simple command
        run:  |
          ls -l > output.txt
      - name: demo_logs
        uses: actions/upload-artifact@v3
        with:  
         path: ./output.txt
         if-no-files-found: warn 
         include-hidden-files: false 
             
