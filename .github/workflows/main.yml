name: Manual Trigger with Approval

on:
  workflow_dispatch:  # Allows manual trigger
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  request-approval:
    runs-on: ubuntu-latest
    environment: manual-approval  # This enforces approval before execution
    steps:
      - name: Log Approver Name
        run: echo "This workflow was approved by ${{ github.actor }}"
      - name: Print message
        run: echo "Workflow  is running after approval!"