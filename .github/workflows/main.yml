name: Hello World Pipeline
on:
  push:
    branches:
      - test_manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello World
        run: echo "👋 Hello, World! This is my first GitHub Actions pipeline."
      - name: print success
        run: echo "job success"
        
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Testing phase going on
        run: echo "Testing phase going on...."
      - name: print success
        run: echo "cheersss success!!!!with daruda parshyaaa....."
  Prod:
    runs-on: ubuntu-latest
    environment: production
    needs: test
    steps:
      - name: Prod phase going on
        run: echo "prod phase going on...."
      - name: print success
        run: echo "Production deployment"
